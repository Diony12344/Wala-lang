<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Karen</title>
	<style>
		h1 button {
			padding: 0;
			border: 0;
			background: none;
			color: inherit;
			font: inherit;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>
		<button type="button" aria-expanded="false" aria-controls="karen-info">
			------Karen Info------
		</button>
	</h1>
	<div id="karen-info" hidden>
		<p>Mabait</p>
		<p>Masipag</p>
	</div>
	<script>
		const toggle = document.querySelector('h1 button');
		const info = document.getElementById('karen-info');

		toggle.addEventListener('click', () => {
			info.hidden = !info.hidden;
			toggle.setAttribute('aria-expanded', String(!info.hidden));
		});
	</script>
</body>
</html>
